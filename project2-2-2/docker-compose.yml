services:
  application:
    image: flask-mysql-app1
    ports:
      - 8000:8000
    networks:
      - flask-app-net
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  # MySQL Database
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eedb
    ports:
      - "3306:3306"
    networks:
      - flask-app-net
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  dbdata:

networks:
  flask-app-net: