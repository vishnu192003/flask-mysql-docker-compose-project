<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>view Employee</title>

    <!-- my css -->
    <link rel="stylesheet" href="static/basic.css">

     <!-- Bootstrap css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" 
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" 
    crossorigin="anonymous">
</head>
<body>
    <div class="container" align="center" >
        <h1>Welcome to Employee Portal</h1>
        <div class ="jumbotron"  align="center">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Salary</th>
                    <th>Address </th>
                    <th>Action</th>
                </tr>
               </thead>
               <tbody>
                {% for emp in employee %}  
                
                 <!-- emp=(101,'A',5000,'pune') -->

                 <!-- employee =((101, 'Sudhir', 5000.0, 'Nagpur'), (102, 'Rahul', 90000.0, 'pune'), (103, 'dinesh', 50000.0, 'Nagpur'))-->
                <tr>
                    <td>{{emp[0]}}</td> 
                    <td>{{emp[1]}}</td>
                    <td>{{emp[2]}}</td>
                    <td>{{emp[3]}}</td>
                    <td>
                        <a href="/edit/{{emp[0]}}" class="btn btn-lg btn-success">Edit</a>
                        <a href="/delete/{{emp[0]}}" class="btn btn-lg btn-danger">delete</a>
                    </td>
                </tr>
               </tbody>
                {% endfor %}
            </table>
        </div> 
    </div>
</body>
</html>
