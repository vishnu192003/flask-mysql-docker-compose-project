<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    
     <!-- Bootstrap css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" 
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" 
    crossorigin="anonymous">
</head>

  <!-- data is come from backend as object of emp (101,sudhir,5000,Nagpur) -->
   
<body> 
    <div class="container" align="center" >
        <h1>Employee Registration</h1>
        <div class ="jumbotron"  align="center">
            <form action="../update/{{emp[0]}}" method="post">
                <table>
                <tr>
                    <td>Employee ID</td> &nbsp; &nbsp; 
                    <td><input type="text" name='eid' value="{{emp[0]}}" readonly></td>
                </tr>
                <tr>
                    <td>Employee Name</td> &nbsp; &nbsp; 
                    <td><input type="text" name='ename' value="{{emp[1]}}"></td>
                </tr>
                <tr>
                    <td>Employee Salary</td> &nbsp; &nbsp; 
                    <td><input type="text" name='esal' value="{{emp[2]}}"></td>
                </tr>
                <tr>
                    <td>Employee Address </td> &nbsp; &nbsp; 
                    <td><input type="text" name='eaddr' value="{{emp[3]}}"></td>
                </tr>
                <tr>
                    <td></td> &nbsp; &nbsp; 
                    <td><input type="submit" name='Update' value="Update" class="btn btn-lg btn-primary"></td>
                </tr>
            </table>
            </form>
        </div>
    </div>
</body>
</html>
